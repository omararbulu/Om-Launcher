name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk "OmLauncher-1.${{ github.run_number }}.apk"

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Om Launcher 1.${{ github.run_number }}
          body: "Descarga el archivo .apk desde el teléfono e instálalo encima de la versión anterior."
          files: OmLauncher-1.${{ github.run_number }}.apk
          make_latest: true
